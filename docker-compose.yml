version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: School
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - school-network

  # Courses Service
  courses-service:
    build: ./courses
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 1234
      DB_NAME: School
    depends_on:
      - postgres
    networks:
      - school-network

  # API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      COURSES_SERVICE_HOST: courses-service
      COURSES_SERVICE_PORT: 3002
    depends_on:
      - courses-service
    networks:
      - school-network

volumes:
  postgres_data:

networks:
  school-network:
    driver: bridge